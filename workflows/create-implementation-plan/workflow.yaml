# Create Implementation Plan Workflow
name: create-implementation-plan
description: "Create phased implementation plan with dependency sequencing for Frappe/ERPNext projects, separating UI-based configuration from code-based implementation"
author: "frappe-experts"

config_source: "{project-root}/{bmad_folder}/frappe-experts/config.yaml"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
module_data_path: "{config_source}:module_data_path"

installed_path: "{project-root}/{bmad_folder}/frappe-experts/workflows/create-implementation-plan"
template: "{installed_path}/template.md"
instructions: "{installed_path}/instructions.md"
validation: "{installed_path}/checklist.md"

default_output_file: "{module_data_path}/implementation/{{project_name}}-implementation-plan-{{date}}.md"

standalone: false
