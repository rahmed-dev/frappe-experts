# Create User Guide Workflow
name: create-user-guide
description: "Generate anti-fluff, action-oriented user documentation for ERPNext features"
author: "frappe-experts"

config_source: "{project-root}/.bmad/custom/modules/frappe-experts/config.yaml"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
module_data_path: "{config_source}:module_data_path"

installed_path: "{project-root}/.bmad/custom/modules/frappe-experts/workflows/create-user-guide"
template: "{installed_path}/template.md"
instructions: "{installed_path}/instructions.md"

default_output_file: "{module_data_path}/guides/{{feature_name}}-quick-guide-{{date}}.md"

standalone: false
